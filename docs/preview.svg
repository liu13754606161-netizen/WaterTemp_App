    <text x="282" y="496">一道湾</text><text x="396" y="496">西北诸河</text><text x="496" y="496">UNKNOWN</text><text x="590" y="496">2022/1/3 0:00</text><text x="730" y="496">-25.041</text><text x="848" y="496">6.078</text>
    <text x="282" y="526">一道湾</text><text x="396" y="526">西北诸河</text><text x="496" y="526">UNKNOWN</text><text x="590" y="526">2022/1/4 0:00</text><text x="730" y="526">-23.221</text><text x="848" y="526">5.992</text>
    <text x="282" y="556">一道湾</text><text x="396" y="556">西北诸河</text><text x="496" y="556">UNKNOWN</text><text x="590" y="556">2022/1/5 0:00</text><text x="730" y="556">-22.704</text><text x="848" y="556">6.031</text>
    <text x="282" y="586">一道湾</text><text x="396" y="586">西北诸河</text><text x="496" y="586">UNKNOWN</text><text x="590" y="586">2022/1/6 0:00</text><text x="730" y="586">-24.113</text><text x="848" y="586">6.012</text>
  </g>
  <g stroke="#eef3f8"><line x1="268" y1="418" x2="1132" y2="418"/><line x1="268" y1="448" x2="1132" y2="448"/><line x1="268" y1="478" x2="1132" y2="478"/><line x1="268" y1="508" x2="1132" y2="508"/><line x1="268" y1="538" x2="1132" y2="538"/><line x1="268" y1="568" x2="1132" y2="568"/></g>
  <text x="268" y="638" fill="#6b7f93" font-size="11">已载入 365 条记录  ·  有效记录 365 条</text>
